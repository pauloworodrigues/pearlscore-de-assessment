# Copy this to secrets.toml (same folder) and adjust if you're not using the
# credentials baked into docker-compose.yml. Run from the repo root, same
# as dlt_pipeline.py itself — dlt resolves .dlt relative to the current
# working directory, not this file's own location:
#
#     cp .dlt/example.secrets.toml .dlt/secrets.toml
#
# secrets.toml is gitignored — it never gets committed, even though these
# happen to be throwaway local-dev values with nothing sensitive in them.

[destination.postgres.credentials]
database = "analytics"
username = "dbt_user"
password = "dbt_password"
host = "localhost"
port = 5432
