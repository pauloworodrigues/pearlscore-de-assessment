# dbt-utils: added for the generic tests it provides (e.g.
# unique_combination_of_columns, a more direct assertion for the #1/#4
# full-row-duplicate defects than the row-count singular test currently
# used — see README's "What I'd do next"). Not yet actually referenced by
# any model or test in this project — declared ahead of that planned use
# rather than added once needed, since it's a trivial dependency to pull
# in and this documents the intent honestly instead of implying it's
# already wired up somewhere.
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
